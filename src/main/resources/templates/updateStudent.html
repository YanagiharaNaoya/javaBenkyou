<!DOCTYPE html>
<html>
<head>
  <title>受講生詳細</title>
</head>
<body>
<h1>受講生詳細</h1>
<form th:action="@{/updateStudent}" th:object="${studentDetail}" method="post">

  <div>
    <label>ID</label>
    <input type="text" th:field="*{student.id}" required/>
  </div>

  <div>
    <label>名前</label>
    <input type="text" th:field="*{student.name}" required/>
  </div>

  <div>
    <label>カナ名</label>
    <input type="text" th:field="*{student.kanaName}" required/>
  </div>

  <div>
    <label>ニックネーム</label>
    <input type="text" th:field="*{student.nickName}" required/>
  </div>

  <div>
    <label>メールアドレス</label>
    <input type="email" th:field="*{student.email}" required/>
  </div>

  <div>
    <label>地域</label>
    <input type="text" th:field="*{student.area}" required/>
  </div>

  <div>
    <label>年齢</label>
    <input type="number" th:field="*{student.age}" />
  </div>

  <div>
    <label>性別</label>
    <input type="text" th:field="*{student.gender}" />
  </div>

  <div>
    <label>備考</label>
    <input type="text" th:field="*{student.remark}" />
  </div>

  <div th:each="course, stat : *{studentsCourses}">
    <label for="id"
           th:for="studentsCourses.[__${stat.index}__].id"> 受講コース名ID</label>
    <input type="text" id="id" th:id="studentsCourses.[__${stat.index}__].id"
           th:field="*{studentsCourses[__${stat.index}__].id}" />
    <label for="courseName"
           th:for="studentsCourses.[__${stat.index}__].courseName"> 受講コース名</label>
    <input type="text" id="courseName" th:id="studentsCourses.[__${stat.index}__].courseName"
           th:field="*{studentsCourses[__${stat.index}__].courseName}" />
  </div>

  <div>
    <button type="submit">更新</button>
  </div>
</form>
</body>
</html>
